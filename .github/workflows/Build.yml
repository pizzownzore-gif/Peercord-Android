name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Bundle libraries so the app works offline
        run: |
          mkdir -p www/libs
          curl -fL -o www/libs/peerjs.min.js https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js
          curl -fL -o www/libs/qrious.min.js https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js
          curl -fL -o www/libs/html5-qrcode.min.js https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/[^/]*/[^/]*/#libs/#g' www/index.html
          grep -c 'libs/' www/index.html
      - run: npx cap add android
      - name: Permissions and background connection service
        run: |
          M=android/app/src/main/AndroidManifest.xml
          P=""
          for x in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA FOREGROUND_SERVICE FOREGROUND_SERVICE_DATA_SYNC FOREGROUND_SERVICE_MICROPHONE POST_NOTIFICATIONS WAKE_LOCK; do
            P="$P<uses-permission android:name=\"android.permission.$x\"/>"
          done
          sed -i "s#</manifest>#$P</manifest>#" $M
          sed -i 's#</application>#<service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="dataSync|microphone"/></application>#' $M
          cp native/*.java android/app/src/main/java/com/peercord/app/
          grep -c KeepAlive $M
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Peercord-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
